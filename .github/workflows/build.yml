name: build and test pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: external workflow
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      actions: write
      attestations: write
      contents: write
      packages: read
      id-token: write
      security-events: write
      pull-requests: write
    with:
      tool: "npm"
      test: "run test"
      build_branch: "run build"
      build_main: "run build"
      artifact_path: "dist"
      npm_audit_omit_dev: true

  # The point of this repository: the library driven against a real backend
  # rather than against mocks. Kept separate from the reusable workflow because
  # it needs the backend containers up and seeded before Playwright starts.
  e2e:
    name: library against a real backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The images are published to GHCR from a private repository, so the
      # pull needs a token even though the workflow only reads.
      - name: log in to ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: start and seed the backend
        run: |
          ./scripts/backend.sh up
          ./scripts/seed.sh

      - run: npx playwright install --with-deps chromium

      - name: run the e2e suite
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: backend logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
