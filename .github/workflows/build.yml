name: build and test pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: external workflow
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      actions: write
      attestations: write
      contents: write
      packages: write
      id-token: write
      security-events: write
      pull-requests: write
    with:
      tool: "npm"
      test: "run test"
      build_branch: "run build"
      build_main: "run build"
      artifact_path: "dist"
      npm_audit_omit_dev: true

  # The point of this repository: the library driven against a real backend
  # rather than against mocks. Kept separate from the reusable workflow because
  # it needs the backend containers up and seeded before Playwright starts.
  e2e:
    name: library against a real backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GHCR packages are private, and a GITHUB_TOKEN minted for this
      # repository cannot read another repository's packages. Rather than
      # requiring a PAT to run the suite, fall back to building the images
      # from the backend repository, which is public.
      - name: build the backend images if they cannot be pulled
        run: |
          if docker pull ghcr.io/tehw0lf/yaft:latest >/dev/null 2>&1 \
            && docker pull ghcr.io/tehw0lf/yaft-db:latest >/dev/null 2>&1; then
            echo "pulled the published images"
          else
            echo "::notice::pull denied, building from tehw0lf/YaFT instead"
            git clone --depth 1 https://github.com/tehw0lf/YaFT.git "$RUNNER_TEMP/yaft"
            docker build -t ghcr.io/tehw0lf/yaft:latest "$RUNNER_TEMP/yaft"
            docker build -f "$RUNNER_TEMP/yaft/db/Dockerfile" \
              -t ghcr.io/tehw0lf/yaft-db:latest "$RUNNER_TEMP/yaft"
          fi

      - name: start and seed the backend
        run: |
          ./scripts/backend.sh up
          ./scripts/seed.sh

      - run: npx playwright install --with-deps chromium

      - name: run the e2e suite
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: backend logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
