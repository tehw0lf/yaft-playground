name: e2e against yaft.tehwolf.de

# The same suite as the e2e job in build.yml, driven against the deployed
# instance instead of containers on the runner. It proves what a local backend
# cannot: Traefik, Cloudflare and CORS in the path.
#
# Manual only. Every run seeds a fresh toggle group in production; the
# retention job removes it once it has gone untouched for 30 days, so a
# schedule would only pile up data nobody reads.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend to run against'
        default: 'https://yaft.tehwolf.de'
        required: true

jobs:
  e2e:
    name: library against the deployed backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The seed makes six writes against a limit of five a minute; seed.sh
      # retries the refused one.
      - name: seed the backend
        env:
          API_URL: ${{ inputs.api_url }}
        run: ./scripts/seed.sh

      - run: npx playwright install --with-deps chromium

      - name: run the e2e suite
        working-directory: e2e
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
